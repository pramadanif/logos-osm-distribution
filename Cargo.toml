[workspace]
resolver = "2"
members = ["osm_core", "osm_sdk"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pramadanif/lp-0018-osm-distribution"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
thiserror = "2"
tempfile = "3"
