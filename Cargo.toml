[workspace]
resolver = "2"
members = ["osm_core", "osm_sdk", "osm_cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pramadanif/logos-osm-distribution"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
thiserror = "2"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
