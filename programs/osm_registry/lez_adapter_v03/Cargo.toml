[package]
name = "lez_adapter_v03"
description = "LEZ v0.3 backend for the LP-0018 registry: SPEL-generated client plus confirmation by read-back"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
nssa        = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.0", package = "lee" }
nssa_core   = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.0", package = "lee_core" }
common      = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.0" }
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.0", features = ["client"] }
wallet      = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.0" }
spel-framework-core = { git = "https://github.com/vpavlin/spel.git", rev = "e43b59be3a80a63e3c0aa5e80a4c020dbf6d65a1" }
osm_sdk     = { path = "../../../osm_sdk" }
osm_core    = { path = "../../../osm_core" }
serde       = { version = "1", features = ["derive"] }
borsh       = "1.5"
hex         = "0.4"
tokio       = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
