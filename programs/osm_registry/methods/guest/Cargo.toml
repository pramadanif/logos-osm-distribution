[package]
name = "osm_registry-guest"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "osm_registry"
path = "src/bin/osm_registry.rs"

[dependencies]
spel-framework = { git = "https://github.com/vpavlin/spel.git", rev = "e43b59be3a80a63e3c0aa5e80a4c020dbf6d65a1" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.0", package = "lee_core" }
risc0-zkvm = { version = "=3.0.5", features = ["std"] }
osm_registry_core = { path = "../../osm_registry_core" }
osm_core = { path = "../../../../osm_core" }
serde = { version = "1.0", features = ["derive"] }
borsh = "1.5"
ruint = "=1.17.0"

