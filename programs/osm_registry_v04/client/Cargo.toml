[package]
name = "osm_registry_v04_client"
description = "osm-chain-v04: confirmed registry writes (register, batch, unhost) on the LEZ 0.4 actor registry"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace]

[[bin]]
name = "osm-chain-v04"
path = "src/main.rs"

[dependencies]
wallet     = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
lee_core   = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1", features = ["host"] }
clock_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
borsh = { version = "1.5", features = ["derive"] }
sha2 = "0.10"
bs58 = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Shared rules and the registry reader (actor_states), from this repository.
osm_core = { path = "../../../osm_core" }
osm_sdk = { path = "../../../osm_sdk" }
serde_json = "1"
anyhow = "1"
# For cycle-bench-v04: the executor path of LEZ's own tools/cycle_bench (prebuilt clock guest).
lee        = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
programs   = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1", default-features = false, features = ["artifacts"] }
risc0-zkvm = { version = "3.0.5", default-features = false, features = ["std"] }
