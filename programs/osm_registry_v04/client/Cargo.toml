[package]
name = "osm_registry_v04_client"
description = "Step-1 client for the LEZ 0.4 actor registry (no SPEL yet): sends Register/Unhost"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace]

[[bin]]
name = "osm-chain-v04"
path = "src/main.rs"

[dependencies]
wallet     = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
lee_core   = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1", features = ["host"] }
clock_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
borsh = { version = "1.5", features = ["derive"] }
sha2 = "0.10"
bs58 = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
