name: modules

# SC-E.3 / P-S3: build every Basecamp module and template with logos-module-builder on Linux and
# macOS, and package them as .lgx. Heavy (Qt, Rust, LEZ wallet): runs on push to main, on
# pull requests touching module code, and by hand.
on:
  push:
    branches: [main]
    paths: ["basecamp/**", "examples/**", "osm_core/**", "osm_sdk/**", "osm_ffi/**", "module.json", "tests/module_load.py", "tests/module_manifests.py", ".github/workflows/modules.yml"]
  pull_request:
    paths: ["basecamp/**", "examples/**", "osm_core/**", "osm_sdk/**", "osm_ffi/**", "module.json", "tests/module_load.py", "tests/module_manifests.py", ".github/workflows/modules.yml"]
  workflow_dispatch:

concurrency:
  group: modules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Manifests consistent (H2, H19)
        run: python3 tests/module_manifests.py
      # Apps and templates depend on our modules through GitHub URLs; point those inputs at
      # this checkout so a change is built together with the modules it needs.
      - name: Build modules and templates
        run: |
          set -eu
          D="--override-input pramadani_osm_distribution path:$PWD/basecamp/osm-distribution"
          S="--override-input pramadani_osm_sdk path:$PWD/basecamp/osm-sdk"
          mkdir -p out
          build() { echo "::group::$1"; nix build -L "$@" --out-link "out/$(basename "$1")"; echo "::endgroup::"; }
          build ./basecamp/osm-sdk#lgx-portable
          build ./basecamp/osm-distribution#lgx-portable
          build ./basecamp/osm-app#lgx-portable $D
          build ./examples/consumer-module#lgx-portable $S
          build ./examples/distribution-consumer-app#lgx-portable $D
      - name: Package checksums
        run: |
          set -eu
          find -L out -name '*.lgx' -exec sha256sum {} + 2>/dev/null || find -L out -name '*.lgx' -exec shasum -a 256 {} +
      - uses: actions/upload-artifact@v4
        with:
          name: lgx-${{ matrix.os }}
          path: out/*/*.lgx
          if-no-files-found: error


  build-more-platforms:
    # Basecamp also ships for Windows (x86_64) and Linux arm64. The module builder cross-compiles
    # the Windows package with mingw on Linux; arm64 builds natively on GitHub's arm runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: windows-x86_64, system: x86_64-windows, runner: ubuntu-latest }
          - { variant: linux-arm64, system: aarch64-linux, runner: ubuntu-24.04-arm }
    name: build (${{ matrix.variant }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build modules and templates
        run: |
          set -eu
          D="--override-input pramadani_osm_distribution path:$PWD/basecamp/osm-distribution"
          S="--override-input pramadani_osm_sdk path:$PWD/basecamp/osm-sdk"
          sys=${{ matrix.system }}
          mkdir -p out
          build() { echo "::group::$1"; nix build -L "$1" "${@:2}" --out-link "out/$(echo "$1" | tr '/#.' '___')"; echo "::endgroup::"; }
          build "./basecamp/osm-sdk#packages.$sys.lgx-portable"
          build "./basecamp/osm-distribution#packages.$sys.lgx-portable"
          build "./basecamp/osm-app#packages.$sys.lgx-portable" $D
          build "./examples/consumer-module#packages.$sys.lgx-portable" $S
          build "./examples/distribution-consumer-app#packages.$sys.lgx-portable" $D
          find -L out -name '*.lgx' -exec sha256sum {} +
      - uses: actions/upload-artifact@v4
        with:
          name: lgx-${{ matrix.variant }}
          path: out/*/*.lgx
          if-no-files-found: error


  basecamp-gui:
    # Appendix E step 6, as the evaluator does it: the released Basecamp (Linux x86_64 AppImage,
    # extracted) under Xvfb with a fresh --user-dir, our app opened in standalone mode with the
    # distribution module beside it. Screenshots are kept as an artifact; a QML warning or error
    # from our files in Basecamp's log fails the job (E58).
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASECAMP_RELEASE: pre-release-4cea4bb-1433
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: X server, software OpenGL, screenshot tools
        run: |
          for i in 1 2 3 4 5; do sudo apt-get update -qq -o Acquire::Retries=3 && break; sleep 30; done
          sudo apt-get install -y -qq xvfb imagemagick xdotool libgl1 libegl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3 >/dev/null
      - name: Basecamp (released AppImage)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release download "$BASECAMP_RELEASE" -R logos-co/logos-basecamp -p 'logos-basecamp-x86_64.AppImage'
          chmod +x logos-basecamp-x86_64.AppImage
          ./logos-basecamp-x86_64.AppImage --appimage-extract >/dev/null
          ls squashfs-root | head
      - name: Build the app and the distribution module (portable install roots)
        run: |
          set -eu
          nix build -L ./basecamp/osm-distribution#install-portable -o dist-install
          nix build -L ./basecamp/osm-app#install-portable -o app-install \
            --override-input pramadani_osm_distribution "path:$PWD/basecamp/osm-distribution"
          ls -R dist-install | head -20; ls -R app-install | head -20
      - name: Open the app in Basecamp and take screenshots
        run: |
          set -u
          mkdir -p shots profile
          Xvfb :99 -screen 0 1440x900x24 >/dev/null 2>&1 &
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 QT_QUICK_BACKEND=
          sleep 2
          ./squashfs-root/AppRun --user-dir "$PWD/profile" --module "$PWD/app-install" \
            --modules-dir "$PWD/dist-install" > basecamp.out 2>&1 &
          for t in 45 30 30; do sleep $t; import -window root "shots/shot-$(date +%s).png"; done
          pkill -f squashfs-root || true
          sleep 3
          cp profile/logs/basecamp.log shots/ 2>/dev/null || true
          cp basecamp.out shots/
          ls -l shots
      - name: Our views loaded without QML warnings
        run: |
          set -eu
          log=shots/basecamp.log
          [ -f "$log" ] || log=shots/basecamp.out
          grep -E 'Successfully loaded UI module: "pramadani_osm_app"' "$log"
          if grep -nE '(Main\.qml|format\.js)[^ ]*:[0-9]+' "$log"; then
            echo "QML warnings or errors from our view (above)"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basecamp-gui
          path: shots/


  side-by-side:
    # SC-D.2b / H19: our released catalog and another LP-0018 catalog in one session.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix build -L 'github:logos-co/logos-logoscore-cli#ctl-bundle-dir' -o ctl-portable
      - run: python3 tests/side_by_side.py ./ctl-portable/bin/logosctl

  load:
    # SC--1.4 (headless part): install the core modules from their .lgx into a logosctl session,
    # load them and call their methods; a call that does not answer with {"ok":true} fails.
    # The dev logosctl takes the -dev variant a local nix build produces.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build logosctl (dev) and the module packages
        run: |
          set -eu
          nix build -L 'github:logos-co/logos-logoscore-cli#ctl' -o ctl
          nix flake metadata --json 'github:logos-co/logos-logoscore-cli' | python3 -c 'import json,sys; print("logosctl rev", json.load(sys.stdin)["revision"])'
          mkdir -p drop
          nix build -L ./basecamp/osm-sdk#lgx -o lgx-osm-sdk
          nix build -L ./basecamp/osm-distribution#lgx -o lgx-osm-distribution
          # The embedding example builds against this checkout's SDK module, not the published one.
          nix build -L ./examples/consumer-module#lgx -o lgx-consumer-module \
            --override-input pramadani_osm_sdk "path:$PWD/basecamp/osm-sdk"
          for o in lgx-osm-sdk lgx-osm-distribution lgx-consumer-module; do cp "$o"/*.lgx drop/; done
          chmod +w drop/*.lgx
          ls -l drop
      - name: Install, load and call
        run: python3 tests/module_load.py ./ctl/bin/logosctl ./drop
