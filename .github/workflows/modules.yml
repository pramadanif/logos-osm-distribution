name: modules

# SC-E.3 / P-S3: build every Basecamp module and template with logos-module-builder on Linux and
# macOS, and package them as .lgx. Heavy (Qt, Rust, LEZ wallet): runs on push to main, on
# pull requests touching module code, and by hand.
on:
  push:
    branches: [main]
    paths: ["basecamp/**", "examples/**", "osm_core/**", "osm_sdk/**", "osm_ffi/**", "module.json", "tests/module_load.py", "tests/module_manifests.py", ".github/workflows/modules.yml"]
  pull_request:
    paths: ["basecamp/**", "examples/**", "osm_core/**", "osm_sdk/**", "osm_ffi/**", "module.json", "tests/module_load.py", "tests/module_manifests.py", ".github/workflows/modules.yml"]
  workflow_dispatch:

concurrency:
  group: modules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Manifests consistent (H2, H19)
        run: python3 tests/module_manifests.py
      # Apps and templates depend on our modules through GitHub URLs; point those inputs at
      # this checkout so a change is built together with the modules it needs.
      - name: Build modules and templates
        run: |
          set -eu
          D="--override-input pramadani_osm_distribution path:$PWD/basecamp/osm-distribution"
          S="--override-input pramadani_osm_sdk path:$PWD/basecamp/osm-sdk"
          mkdir -p out
          build() { echo "::group::$1"; nix build -L "$@" --out-link "out/$(basename "$1")"; echo "::endgroup::"; }
          build ./basecamp/osm-sdk#lgx-portable
          build ./basecamp/osm-distribution#lgx-portable
          build ./basecamp/osm-app#lgx-portable $D
          build ./examples/consumer-module#lgx-portable $S
          build ./examples/distribution-consumer-app#lgx-portable $D
      - name: Package checksums
        run: |
          set -eu
          find -L out -name '*.lgx' -exec sha256sum {} + 2>/dev/null || find -L out -name '*.lgx' -exec shasum -a 256 {} +
      - uses: actions/upload-artifact@v4
        with:
          name: lgx-${{ matrix.os }}
          path: out/*/*.lgx
          if-no-files-found: error


  build-more-platforms:
    # Basecamp also ships for Windows (x86_64) and Linux arm64. The module builder cross-compiles
    # the Windows package with mingw on Linux; arm64 builds natively on GitHub's arm runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: windows-x86_64, system: x86_64-windows, runner: ubuntu-latest }
          - { variant: linux-arm64, system: aarch64-linux, runner: ubuntu-24.04-arm }
    name: build (${{ matrix.variant }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build modules and templates
        run: |
          set -eu
          D="--override-input pramadani_osm_distribution path:$PWD/basecamp/osm-distribution"
          S="--override-input pramadani_osm_sdk path:$PWD/basecamp/osm-sdk"
          sys=${{ matrix.system }}
          mkdir -p out
          build() { echo "::group::$1"; nix build -L "$1" "${@:2}" --out-link "out/$(echo "$1" | tr '/#.' '___')"; echo "::endgroup::"; }
          build "./basecamp/osm-sdk#packages.$sys.lgx-portable"
          build "./basecamp/osm-distribution#packages.$sys.lgx-portable"
          build "./basecamp/osm-app#packages.$sys.lgx-portable" $D
          build "./examples/consumer-module#packages.$sys.lgx-portable" $S
          build "./examples/distribution-consumer-app#packages.$sys.lgx-portable" $D
          find -L out -name '*.lgx' -exec sha256sum {} +
      - uses: actions/upload-artifact@v4
        with:
          name: lgx-${{ matrix.variant }}
          path: out/*/*.lgx
          if-no-files-found: error

  load:
    # SC--1.4 (headless part): install the core modules from their .lgx into a logosctl session,
    # load them and call their methods; a call that does not answer with {"ok":true} fails.
    # The dev logosctl takes the -dev variant a local nix build produces.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build logosctl (dev) and the module packages
        run: |
          set -eu
          nix build -L 'github:logos-co/logos-logoscore-cli#ctl' -o ctl
          nix flake metadata --json 'github:logos-co/logos-logoscore-cli' | python3 -c 'import json,sys; print("logosctl rev", json.load(sys.stdin)["revision"])'
          mkdir -p drop
          nix build -L ./basecamp/osm-sdk#lgx -o lgx-osm-sdk
          nix build -L ./basecamp/osm-distribution#lgx -o lgx-osm-distribution
          # The embedding example builds against this checkout's SDK module, not the published one.
          nix build -L ./examples/consumer-module#lgx -o lgx-consumer-module \
            --override-input pramadani_osm_sdk "path:$PWD/basecamp/osm-sdk"
          for o in lgx-osm-sdk lgx-osm-distribution lgx-consumer-module; do cp "$o"/*.lgx drop/; done
          chmod +w drop/*.lgx
          ls -l drop
      - name: Install, load and call
        run: python3 tests/module_load.py ./ctl/bin/logosctl ./drop
