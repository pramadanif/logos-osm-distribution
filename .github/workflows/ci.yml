name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  storage-retrieval:
    # H3 / SC-E.2: node B fetches a CID that only node A holds, over the network.
    runs-on: ubuntu-latest
    env:
      STORAGE_VERSION: v0.5.3
      OSM_REQUIRE_REAL_STORAGE: "1"
      STORAGE_SHA256: 1086fae4f283cab882f133abe4d5a88cfae8d61edba9f0094c7f75b368ec9d56
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      # The zip is cached by its sha256, so a GitHub release outage does not block later runs.
      - uses: actions/cache@v4
        with:
          path: storage.zip
          key: logos-storage-${{ env.STORAGE_VERSION }}-${{ env.STORAGE_SHA256 }}
      - name: Fetch pinned Logos Storage node
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            [ -f storage.zip ] && break
            gh release download "$STORAGE_VERSION" -R logos-storage/logos-storage-nim \
              -p "logos-storage-linux-amd64-$STORAGE_VERSION.zip" -O storage.zip && break
            echo "download attempt $i failed"; sleep $((i * 20))
          done
          echo "$STORAGE_SHA256  storage.zip" | sha256sum -c -
          unzip -q storage.zip -d storage-bin
          chmod +x storage-bin/*
      - name: Start two nodes
        run: |
          set -euo pipefail
          scripts/storage-two-nodes.sh "$(ls storage-bin/logos-storage-*)" "$RUNNER_TEMP/storage" | tee -a "$GITHUB_ENV"
      - run: cargo test --locked -p osm_sdk --test real_storage -- --nocapture

  idl:
    # H1 / SC-B.3: the committed IDL must equal what SPEL generates from the program source.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      # pcsc-sys (keycard support in the LEZ wallet crate) links libpcsclite.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libpcsclite-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: programs/osm_registry
      - name: Build the IDL generator (upstream build scripts download artifacts; retried on network errors)
        working-directory: programs/osm_registry
        run: |
          for i in 1 2 3; do cargo build --locked --bin generate_idl && exit 0; echo "attempt $i failed"; sleep 30; done; exit 1
      - name: Regenerate IDL with SPEL
        working-directory: programs/osm_registry
        run: cargo run --locked --bin generate_idl > "$RUNNER_TEMP/osm_registry.json"
      - name: Diff against committed IDL
        run: |
          diff -u idl/osm_registry.json "$RUNNER_TEMP/osm_registry.json"
          diff -u programs/osm_registry/osm_registry-idl.json "$RUNNER_TEMP/osm_registry.json"
